; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env]
platform = espressif32
framework = arduino
lib_deps =
	; sstaub/sACN@^1.1.0
	fastled/FastLED@^3.9.4
	bblanchon/ArduinoJson@^7.2.1
	h2zero/NimBLE-Arduino@^1.4.1

[env:lolin_c3_mini]
board = lolin_c3_mini
; WiFi + BLE + FastLED together do not fit the default 1.2MB app partition.
; huge_app gives a 3MB app slice (no OTA). Switching schemes may relocate NVS,
; so a one-time full erase + reflash can be needed after this change.
board_build.partitions = huge_app.csv
build_flags =
	-Wl,-Map,firmware.map

; [env:denky32]
; board = denky32
; monitor_speed = 115200