; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
framework = arduino
build_unflags = -std=gnu++11 -std=gnu++17 -std=gnu++2a -std=gnu++2b -Os
build_flags =
	-std=gnu++23
	-O2
; Only for src/: a printf-style format/argument mismatch (e.g. in snprintf) is
; a compile error. The framework doesn't enable it.
build_src_flags =
	-Werror=format
lib_deps = 
	; sstaub/sACN@^1.1.0
	; 3.10.8 doesn't build with this core (exception specifier mismatch)
	fastled/FastLED@3.10.3
	bblanchon/ArduinoJson@^7.2.1

[env:lolin_c3_mini]
board = lolin_c3_mini
; Two 1.875 MB app slots, so an update can be written next to the running
; firmware (OTA). NVS sits at the same offset as in huge_app.csv.
board_build.partitions = min_spiffs.csv
build_flags =
	${env.build_flags}
	-Wl,-Map,firmware.map

; Same board with libstdc++ assertions: std::span / std::array / std::vector
; bounds are checked at runtime and abort with a message on overflow.
[env:lolin_c3_mini_debug]
extends = env:lolin_c3_mini
build_flags =
	${env:lolin_c3_mini.build_flags}
	-D_GLIBCXX_ASSERTIONS

; Wireless upload. Open the window first: {"cmd":"ota"} (5 min), then
;   pio run -e lolin_c3_mini_ota -t upload --upload-port <fixture ip>
[env:lolin_c3_mini_ota]
extends = env:lolin_c3_mini
upload_protocol = espota
upload_port = 192.168.0.140
upload_flags =
	--port=3232
	--auth=lucke-ota

; [env:denky32]
; board = denky32
; monitor_speed = 115200